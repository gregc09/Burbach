name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Assemble only what should be public, rather than publishing the whole
      # repo. .nojekyll keeps Pages from running the files through Jekyll.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R hook-echo _site/
          cp -R bait-station _site/
          cp -R blasting-kidney-stones _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
